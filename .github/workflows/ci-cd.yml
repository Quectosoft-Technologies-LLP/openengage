name: OpenEngage CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/openengage

jobs:
  # ── Test ─────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openengage_test
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install dependencies
        run: |
          cd ai_gateway
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/openengage_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/openengage_test
          REDIS_URL: redis://localhost:6379/0
          ENV: test
          JWT_SECRET: test_secret_key_32_chars_minimum_x
        run: cd ai_gateway && pytest tests/ -v --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && npm test -- --watchAll=false

  # ── Security scan ────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit (Python security linter)
        run: |
          pip install bandit
          bandit -r ai_gateway/ integrations/ -ll -x ai_gateway/tests
      - name: Run Trivy (dependency scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ── Build & Push Docker images ───────────────────────────
  build-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AI Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./ai_gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai-gateway:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

  # ── Deploy to GCP ────────────────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to GCP VM
        run: |
          gcloud compute ssh openengage-prod --zone=asia-south1-a --command="
            cd /opt/openengage &&
            docker compose pull &&
            docker compose up -d --no-deps ai_gateway frontend worker beat &&
            docker compose exec -T ai_gateway alembic upgrade head &&
            echo 'Deployment complete'
          "
