# Nginx production config with TLS termination
# Place SSL certs at /etc/nginx/ssl/cert.pem and /etc/nginx/ssl/key.pem

upstream ai_gateway {
    server ai_gateway:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name your-openengage.com;
    return 301 https://$host$request_uri;
}

# HTTPS termination
server {
    listen 443 ssl http2;
    server_name your-openengage.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50M;   # Allow CSV uploads

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # API Gateway
    location /api/ {
        proxy_pass http://ai_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_limit burst=20 nodelay;
    }

    # WebSocket (Copilot)
    location /ws/ {
        proxy_pass http://ai_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Webhooks (higher rate limit)
    location /webhooks/ {
        proxy_pass http://ai_gateway;
        proxy_set_header X-Real-IP $remote_addr;
        limit_req zone=webhook_limit burst=50 nodelay;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://ai_gateway;
        access_log off;
    }
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=200r/m;
